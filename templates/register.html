{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account — Rural Opportunity Connect{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-16 relative overflow-hidden bg-gradient-to-b from-[#071526] via-[#0b1e36] to-slate-950 anim-mesh-bg">
    <!-- Ambient glowing floating nodes -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none anim-orb-float"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none anim-orb-float" style="animation-delay: -6s;"></div>

    <div class="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-2xl border border-cyan-500/30 relative z-10 modal-spring-enter hover-lift-3d card-specular-glare">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#071526] border-2 border-cyan-400/50 rounded-2xl p-1.5 flex items-center justify-center mx-auto mb-4 shadow-xl shadow-cyan-950/50 hover-lift-3d">
                <img src="{% static 'images/logo-icon.png' %}?v=4.0" alt="Connect Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                Create Free <span class="shiny-text-dark">Profile</span>
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Unlock 1-click Quick Apply and personalized opportunity matching
            </p>
        </div>

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-3">
                <!-- First Name -->
                <div>
                    <label class="form-label" for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" required placeholder="e.g. Ramesh" class="form-input text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                </div>
                <!-- Last Name -->
                <div>
                    <label class="form-label" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required placeholder="e.g. Kumar" class="form-input text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                </div>
            </div>

            <!-- Username -->
            <div>
                <label class="form-label" for="username">Choose a Username</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required placeholder="e.g. ramesh_2026" class="form-input pl-9 text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                    <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Email -->
            <div>
                <label class="form-label" for="email">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required placeholder="e.g. ramesh@example.com" class="form-input pl-9 text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                    <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="form-label" for="password">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="Create a strong password" class="form-input pl-9 text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                    <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" class="form-input pl-9 text-xs focus:ring-2 focus:ring-cyan-500 transition-all">
                    <i class="fas fa-shield-halved absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" class="btn-primary w-full py-3 text-sm font-bold shadow-lg shadow-brand-950/20 btn-sheen spring-press">
                    <i class="fas fa-user-plus"></i> Create Free Account
                </button>
            </div>
        </form>

        <!-- Divider & Login Link -->
        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Already have an account?
                <a href="{% url 'login' %}" class="text-brand-800 hover:text-brand-950 font-bold ml-1">
                    Sign In →
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
