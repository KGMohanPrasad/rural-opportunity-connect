<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the user logo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="50%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#06121f" />
    </linearGradient>

    <!-- Node Gradient: Electric Cyan to Tech Blue -->
    <linearGradient id="nodeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="30%" stop-color="#00d2d3" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Base with subtle rounded corners -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />

  <!-- The Interconnected Double-S Spiral Nodes -->
  <g filter="url(#glow)" transform="translate(200, 180)">
    <!-- Connected Fluid Links (Capsules/Pills) -->
    <!-- Top-right link -->
    <path d="M 0 -70 C 35 -70 45 -40 45 -20 C 45 0 25 20 0 20 C -25 20 -45 0 -45 -20 C -45 -50 -20 -70 0 -70 Z" fill="url(#nodeGrad)" opacity="0.95" />
    
    <!-- Central S-curve connector -->
    <path d="M -20 -35 C 40 -35 40 35 -20 35 C -40 35 -40 -35 20 -35" fill="none" stroke="url(#nodeGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left orbiting node link -->
    <path d="M -50 -10 C -20 -10 0 15 0 35 C 0 60 -30 80 -60 60 C -80 40 -70 10 -50 -10 Z" fill="url(#nodeGrad)" opacity="0.95" />
    
    <!-- Distinct Interconnected Circles -->
    <!-- Node Top Center -->
    <circle cx="15" cy="-80" r="26" fill="#00f2fe" />
    <!-- Node Top Right -->
    <circle cx="65" cy="-45" r="24" fill="#00e5db" />
    <!-- Node Middle Far Left -->
    <circle cx="-65" cy="-25" r="23" fill="#00d2d3" />
    <!-- Node Upper Center -->
    <circle cx="15" cy="-20" r="25" fill="#06b6d4" />
    <!-- Node Center -->
    <circle cx="-15" cy="15" r="25" fill="#0ea5e9" />
    <!-- Node Middle Right -->
    <circle cx="65" cy="10" r="23" fill="#0284c7" />
    <!-- Node Lower Left -->
    <circle cx="-50" cy="50" r="24" fill="#0284c7" />
    <!-- Node Bottom Center -->
    <circle cx="-15" cy="80" r="26" fill="#0072ff" />
  </g>

  <!-- CONNECT text in crisp white tracking font -->
  <text x="200" y="340" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="14">CONNECT</text>
</svg>
